<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="studioBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#242528" />
      <stop offset="100%" stop-color="#111112" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#58cced" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Dark Studio Frame -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#studioBg)" stroke="#2c2d30" stroke-width="12" />
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="#58cced" stroke-opacity="0.22" stroke-width="4" />

  <!-- Bold Neon Cyan "H" with 3A Glow -->
  <path
    d="M 144 96 V 296 M 368 96 V 296 M 144 196 H 368"
    stroke="#58cced"
    stroke-width="58"
    stroke-linecap="round"
    filter="url(#neonGlow)"
  />

  <!-- 4 Staggered Vertical Stem EQ Meter Bars (3B: Vocals, Drums, Bass, Inst) -->
  <rect x="114" y="364" width="44" height="64" rx="14" fill="#ff0055" />
  <rect x="194" y="340" width="44" height="88" rx="14" fill="#00ff88" />
  <rect x="274" y="352" width="44" height="76" rx="14" fill="#bc13fe" />
  <rect x="354" y="372" width="44" height="56" rx="14" fill="#ff9900" />
</svg>
